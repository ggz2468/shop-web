name: CI/CD for Vue Frontend

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Set env from .env
        run: |
          echo "VITE_APP_TITLE=鈞弘電子商務" >> $GITHUB_ENV
          echo "VITE_BASE_URL=/" >> $GITHUB_ENV
          echo "VITE_API_BASE_URL=/api" >> $GITHUB_ENV
          echo "VITE_SANCTUM_CSRF_COOKIE_URL=/sanctum/csrf-cookie" >> $GITHUB_ENV

          echo "CYPRESS_VITE_APP_TITLE=鈞弘電子商務" >> $GITHUB_ENV

      - name: Run unit tests
        run: npm run test:unit

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Archive production build
        run: tar -czf dist.tar.gz dist

      - name: Deploy to GCP Compute Engine
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: "dist.tar.gz"
          target: ${{ secrets.GCP_TARGET_DIR }}

      - name: Extract and Replace on Server (Zero-downtime)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            TARGET_DIR="${{ secrets.GCP_TARGET_DIR }}"
            RELEASE_NAME="release-${{ github.run_id }}"
            
            cd $TARGET_DIR
            
            # 建立本次部署的專屬目錄並解壓
            mkdir -p releases/$RELEASE_NAME
            tar -xzf dist.tar.gz -C releases/$RELEASE_NAME
            rm dist.tar.gz
            
            # 確保 Nginx 指向的是 $TARGET_DIR/current
            # 原子級變更軟連結，達成無縫切換
            rm -f current
            ln -s releases/$RELEASE_NAME/dist current
            
            # 自動清理舊版本，只保留最近 3 次的歷史紀錄
            cd releases && ls -t | tail -n +4 | xargs rm -rf 2>/dev/null || true
